<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>لعبة النقر المتطورة - كود سري</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(145deg, #1a2a3a, #0f1a24);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #eee;
            padding: 16px;
        }
        .login-screen {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        .login-card {
            background: #2c3e2f; padding: 2rem; border-radius: 40px;
            text-align: center; width: 90%; max-width: 400px;
            box-shadow: 0 20px 30px rgba(0,0,0,0.5);
        }
        .login-card input {
            display: block; width: 100%; margin: 1rem 0; padding: 12px;
            border-radius: 60px; border: none; font-size: 1rem; text-align: center;
        }
        .login-card button, .upgrade-btn, .reset-btn {
            background: #f39c12; color: #2c3e2f; font-weight: bold;
            padding: 10px 20px; border: none; border-radius: 60px;
            cursor: pointer; transition: 0.2s;
        }
        .login-card button:hover, .upgrade-btn:hover, .reset-btn:hover {
            background: #e67e22; transform: scale(1.02);
        }
        .game-screen { width: 100%; max-width: 1200px; margin: 0 auto; }
        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #1e2a32cc; backdrop-filter: blur(10px);
            padding: 12px 20px; border-radius: 60px; margin-bottom: 25px;
            flex-wrap: wrap; gap: 10px;
        }
        .player-info span { background: #00000066; padding: 5px 12px; border-radius: 30px; margin-left: 10px; }
        .leaderboard-btn { background: #e67e22; padding: 5px 20px; border-radius: 40px; cursor: pointer; font-weight: bold; }
        .game-main { display: flex; flex-wrap: wrap; gap: 30px; justify-content: center; }
        .score-area {
            background: #1f2b24; padding: 2rem; border-radius: 60px; text-align: center;
            flex: 1; min-width: 250px;
        }
        .score-value { font-size: 5rem; font-weight: bold; color: gold; margin: 20px 0; }
        .click-btn {
            background: #e67e22; border: none; padding: 20px 40px; font-size: 2rem;
            border-radius: 100px; cursor: pointer; color: white;
            transition: 0.07s linear; box-shadow: 0 5px 0 #a04000;
            width: 100%; max-width: 280px;
        }
        .click-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #a04000; }
        .upgrades-area {
            background: #1f2b24; padding: 1.5rem; border-radius: 60px;
            flex: 1; min-width: 260px;
        }
        .upgrade-card {
            background: #2c3e2f; margin: 15px 0; padding: 12px; border-radius: 40px;
            display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
        }
        .upgrade-stats {
            margin-top: 20px; display: flex; justify-content: space-between;
            background: #00000066; padding: 12px; border-radius: 40px;
        }
        .reset-btn { background: #7f8c8d; margin-top: 20px; }
        .modal {
            display: none; position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); justify-content: center; align-items: center; z-index: 200;
        }
        .modal-content {
            background: #2c3e2f; padding: 20px; border-radius: 40px;
            width: 90%; max-width: 500px; max-height: 70vh; overflow-y: auto;
        }
        .close-modal { float: left; font-size: 28px; cursor: pointer; }
        .leaderboard-item {
            background: #1e2a2e; margin: 8px 0; padding: 8px; border-radius: 30px;
            display: flex; justify-content: space-between;
        }
        @media (max-width: 700px) {
            .click-btn { font-size: 1.5rem; padding: 12px 25px; }
            .score-value { font-size: 3rem; }
        }
        /* تلميح الكود السري (اختياري) */
        .secret-hint {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 10px;
            color: #aaa;
            background: rgba(0,0,0,0.5);
            padding: 2px 6px;
            border-radius: 12px;
            pointer-events: none;
            z-index: 999;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
<div class="secret-hint">🔐 كود سري: anasp5708</div>

<div id="loginScreen" class="login-screen">
    <div class="login-card">
        <h1>👋 لعبة النقر المتطورة</h1>
        <p>سجل بياناتك وابدأ التنافس</p>
        <input type="text" id="playerName" placeholder="اسم اللاعب" required>
        <input type="tel" id="playerPhone" placeholder="رقم الجوال أو المعرف" required>
        <button id="startGameBtn">🎮 ابدأ اللعب</button>
    </div>
</div>

<div id="gameScreen" class="game-screen" style="display: none;">
    <header class="game-header">
        <div class="player-info">
            <span id="displayName">اللاعب: ---</span>
            <span id="displayPhone">رقم: ---</span>
        </div>
        <div class="leaderboard-btn" id="showLeaderboard">🏆 الترتيب العالمي</div>
    </header>
    <main class="game-main">
        <div class="score-area">
            <h2>نقاطك</h2>
            <div class="score-value" id="scoreValue">0</div>
            <button class="click-btn" id="clickButton">🔘 انقر هنا +<span id="clickPower">1</span></button>
        </div>
        <div class="upgrades-area">
            <h3>متجر التحسينات</h3>
            <div class="upgrade-card">
                <span>💪 قوة النقرة +1</span>
                <span id="clickUpgradeCost">السعر: 50</span>
                <button id="upgradeClick" class="upgrade-btn">شراء</button>
            </div>
            <div class="upgrade-card">
                <span>🤖 نقرة تلقائية +1 نقطة/ث</span>
                <span id="autoUpgradeCost">السعر: 200</span>
                <button id="buyAutoClicker" class="upgrade-btn">شراء</button>
            </div>
            <div class="upgrade-stats">
                <span>🚀 قوة النقرة: <span id="currentClickPower">1</span></span>
                <span>⚙️ النقاط/ث: <span id="currentAutoCount">0</span></span>
            </div>
        </div>
    </main>
    <div style="text-align: center;">
        <button id="resetGameBtn" class="reset-btn">🔄 إعادة تعيين نقاطي</button>
    </div>
</div>

<div id="leaderboardModal" class="modal">
    <div class="modal-content">
        <span class="close-modal">&times;</span>
        <h2>🏅 أفضل اللاعبين</h2>
        <div id="leaderboardList"></div>
    </div>
</div>

<script>
    const socket = io();
    // عناصر DOM
    const loginScreen = document.getElementById('loginScreen');
    const gameScreen = document.getElementById('gameScreen');
    const startBtn = document.getElementById('startGameBtn');
    const playerNameInput = document.getElementById('playerName');
    const playerPhoneInput = document.getElementById('playerPhone');
    const displayNameSpan = document.getElementById('displayName');
    const displayPhoneSpan = document.getElementById('displayPhone');
    const scoreSpan = document.getElementById('scoreValue');
    const clickButton = document.getElementById('clickButton');
    const upgradeClickBtn = document.getElementById('upgradeClick');
    const buyAutoClickerBtn = document.getElementById('buyAutoClicker');
    const currentClickPowerSpan = document.getElementById('currentClickPower');
    const currentAutoCountSpan = document.getElementById('currentAutoCount');
    const resetGameBtn = document.getElementById('resetGameBtn');
    const leaderboardBtn = document.getElementById('showLeaderboard');
    const leaderboardModal = document.getElementById('leaderboardModal');
    const leaderboardListDiv = document.getElementById('leaderboardList');
    const closeModalSpan = document.querySelector('.close-modal');
    const clickUpgradeCostSpan = document.getElementById('clickUpgradeCost');
    const autoUpgradeCostSpan = document.getElementById('autoUpgradeCost');

    let player = { name: '', phone: '', score: 0, upgrades: { clickPower: 1, autoClicker: 0 }, clicks: 0 };
    let autoInterval = null;

    // دوال حساب السعر المتزايد
    function getClickUpgradeCost(currentPower) {
        return 50 + (currentPower - 1) * 20;
    }
    function getAutoUpgradeCost(currentAuto) {
        return 200 + (currentAuto) * 100;
    }
    function updatePrices() {
        clickUpgradeCostSpan.innerText = `السعر: ${getClickUpgradeCost(player.upgrades.clickPower)}`;
        autoUpgradeCostSpan.innerText = `السعر: ${getAutoUpgradeCost(player.upgrades.autoClicker)}`;
    }

    async function saveToServer() {
        try {
            await fetch('/api/player', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: player.name, phone: player.phone, score: player.score, upgrades: player.upgrades, clicks: player.clicks })
            });
        } catch(e) { console.warn(e); }
    }

    async function loadPlayerData(phone) {
        try {
            const res = await fetch(`/api/player/${encodeURIComponent(phone)}`);
            const data = await res.json();
            if (data.success && data.player) return data.player;
            return null;
        } catch(e) { return null; }
    }

    async function loadLeaderboard() {
        try {
            const res = await fetch('/api/leaderboard');
            const top = await res.json();
            leaderboardListDiv.innerHTML = '';
            top.forEach((p, idx) => {
                const div = document.createElement('div');
                div.className = 'leaderboard-item';
                div.innerHTML = `<span>${idx+1}. ${p.name}</span><span>🏆 ${p.score}</span>`;
                leaderboardListDiv.appendChild(div);
            });
        } catch(e) { leaderboardListDiv.innerHTML = '<p>خطأ في تحميل الترتيب</p>'; }
    }

    function updateUI() {
        scoreSpan.innerText = player.score;
        currentClickPowerSpan.innerText = player.upgrades.clickPower;
        currentAutoCountSpan.innerText = player.upgrades.autoClicker;
        document.getElementById('clickPower').innerText = player.upgrades.clickPower;
        updatePrices();
    }

    function addPoints(points) {
        player.score += points;
        player.clicks++;
        updateUI();
        saveToServer();
    }

    function buyClickUpgrade() {
        const cost = getClickUpgradeCost(player.upgrades.clickPower);
        if (player.score >= cost) {
            player.score -= cost;
            player.upgrades.clickPower++;
            updateUI();
            saveToServer();
        } else alert(`لا تملك ${cost} نقطة`);
    }

    function buyAuto() {
        const cost = getAutoUpgradeCost(player.upgrades.autoClicker);
        if (player.score >= cost) {
            player.score -= cost;
            player.upgrades.autoClicker++;
            updateUI();
            saveToServer();
            if (autoInterval) clearInterval(autoInterval);
            if (player.upgrades.autoClicker > 0) {
                autoInterval = setInterval(() => addPoints(player.upgrades.autoClicker), 1000);
            }
        } else alert(`يحتاج ${cost} نقطة`);
    }

    function resetProgress() {
        if (confirm('هل تريد تصفير نقاطك وتحسيناتك؟')) {
            player.score = 0;
            player.upgrades = { clickPower: 1, autoClicker: 0 };
            player.clicks = 0;
            if (autoInterval) clearInterval(autoInterval);
            autoInterval = null;
            updateUI();
            saveToServer();
        }
    }

    async function startGame(name, phone) {
        const existingData = await loadPlayerData(phone);
        if (existingData) {
            player = existingData;
            if (player.upgrades.autoClicker > 0 && !autoInterval) {
                autoInterval = setInterval(() => addPoints(player.upgrades.autoClicker), 1000);
            }
            displayNameSpan.innerText = `اللاعب: ${player.name}`;
            displayPhoneSpan.innerText = `رقم: ${player.phone}`;
            loginScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            updateUI();
            saveToServer();
        } else {
            player = { name, phone, score: 0, upgrades: { clickPower: 1, autoClicker: 0 }, clicks: 0 };
            displayNameSpan.innerText = `اللاعب: ${name}`;
            displayPhoneSpan.innerText = `رقم: ${phone}`;
            loginScreen.style.display = 'none';
            gameScreen.style.display = 'block';
            updateUI();
            saveToServer();
        }
    }

    function validateAndStart() {
        const name = playerNameInput.value.trim();
        const phone = playerPhoneInput.value.trim();
        if (!name || !phone) return alert('يرجى إدخال الاسم والرقم');
        startGame(name, phone);
    }

    // ------------------- الكود السري -------------------
    let secretBuffer = "";
    const secretCode = "anasp5708";

    window.addEventListener('keydown', (e) => {
        // نضيف الحرف إلى المخزن المؤقت
        secretBuffer += e.key;
        // نحافظ على طول المخزن كم طول الكود السري
        if (secretBuffer.length > secretCode.length) {
            secretBuffer = secretBuffer.slice(-secretCode.length);
        }
        if (secretBuffer === secretCode) {
            secretBuffer = "";
            // عرض مربع حوار لإدخال النقاط الجديدة
            let newScore = prompt("✨ كود سري صحيح! أدخل عدد النقاط الجديد:", player.score);
            if (newScore !== null) {
                let parsed = parseInt(newScore);
                if (!isNaN(parsed) && parsed >= 0) {
                    player.score = parsed;
                    updateUI();
                    saveToServer();
                    alert(`✅ تم تغيير النقاط إلى ${player.score}`);
                } else {
                    alert("❌ قيمة غير صالحة. أدخل رقماً صحيحاً أكبر من أو يساوي صفر.");
                }
            }
        }
    });
    // -------------------------------------------------

    // أحداث الأزرار
    startBtn.addEventListener('click', validateAndStart);
    clickButton.addEventListener('click', () => addPoints(player.upgrades.clickPower));
    upgradeClickBtn.addEventListener('click', buyClickUpgrade);
    buyAutoClickerBtn.addEventListener('click', buyAuto);
    resetGameBtn.addEventListener('click', resetProgress);
    leaderboardBtn.addEventListener('click', async () => { await loadLeaderboard(); leaderboardModal.style.display = 'flex'; });
    closeModalSpan.addEventListener('click', () => leaderboardModal.style.display = 'none');
    window.addEventListener('click', (e) => { if (e.target === leaderboardModal) leaderboardModal.style.display = 'none'; });

    // تأكد من تحميل البيانات إذا كان المستخدم قد سجل دخوله مسبقًا (ليس ضروريًا)
    // لكن الصفحة تبدأ بشاشة دخول فقط.
</script>
</body>
</html>
